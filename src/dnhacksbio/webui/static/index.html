<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dnhacksbio · console</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/projects.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="wordmark"><span class="dot"></span> dnhacksbio</div>
      <!-- The analysis you are in. Every view below is scoped to it. Filled by projects.js. -->
      <div id="project-switcher" class="proj-switcher"></div>
      <nav class="nav" id="nav">
        <a data-view="corpus">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 18.5A2 2 0 0 1 6 16.5h13"/><path d="M8 7.5h7M8 10.5h5"/></svg>
          Corpus
        </a>
        <a data-view="workflow">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="5" height="6" rx="1.2"/><rect x="16.5" y="9" width="5" height="6" rx="1.2"/><rect x="9.5" y="3" width="5" height="5" rx="1.2"/><rect x="9.5" y="16" width="5" height="5" rx="1.2"/><path d="M7.5 12h2M14.5 12h2M12 8v8"/></svg>
          Workflow
        </a>
        <a data-view="tree">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 7c0 2-6 2-6 4v2M12 7c0 2 6 2 6 4v2"/><rect x="9.5" y="1" width="5" height="4" rx="1"/><rect x="3" y="14" width="6" height="4" rx="1"/><rect x="15" y="14" width="6" height="4" rx="1"/></svg>
          Search tree
        </a>
        <a data-view="runs">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>
          Runs
        </a>
        <a data-view="graph">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="9" cy="18" r="2.4"/><path d="M7.7 7.4 16 8.6M8 15.9l1-8"/></svg>
          Knowledge graph
        </a>
        <a data-view="review">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6"/></svg>
          Review
        </a>
      </nav>
      <div class="grow"></div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-label">Light</span>
      </button>
    </aside>
    <main class="main" id="main"><div class="loading">Loading…</div></main>
  </div>
  <script src="/static/app.js"></script>
  <script src="/static/projects.js"></script>
</body>
</html>
